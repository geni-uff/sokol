[project]
name = "sokol-vision"
version = "0.8.2"
description = "SOKOL Vision Service — weapon cascade (YOLO26x + YOLO-World + Grounding DINO)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "ultralytics>=8.4.123",
    "pillow",
    "httpx",
    "huggingface-hub",
    "transformers>=4.40.0",
    "timm",
    "ftfy",
    "clip @ git+https://github.com/ultralytics/CLIP.git",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
