[project]
name = "sokol-face"
version = "0.1.0"
description = "SOKOL Face Recognition Service — InsightFace detection + embeddings"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "insightface",
    "onnxruntime",
    "opencv-python-headless",
    "numpy",
    "pillow",
    "httpx",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
