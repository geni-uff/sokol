server {
    listen ${SOKOL_WEB_PORT};
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 0;

    # Docker Desktop (bridge): re-resolve sokol-api when the container IP changes.
    # Sem isto o login fica em "Entrando..." com proxy para IP morto.
    resolver 127.0.0.11 ipv6=off valid=5s;

    location /api/ {
        set $sokol_api "${SOKOL_API_PROXY}";
        proxy_pass http://$sokol_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
}
