server {
    listen ${SOKOL_WEB_PORT};
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 0;

    # Docker Desktop: API pela porta publicada no host (mesmo caminho do curl).
    # proxy_pass SEM variável nginx → corta /api/ corretamente.
    # host.docker.internal evita DNS interno entre containers.
    location /api/ {
        proxy_pass http://host.docker.internal:${SOKOL_API_PORT}/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
}
