[project]
name = "sokol-embed"
version = "0.1.0"
description = "SOKOL embedding service — OpenAI-compatible"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sentence-transformers>=3.0",
    "torch>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
