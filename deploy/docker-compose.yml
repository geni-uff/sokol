services:
  # ---------------------------------------------------------------------------
  # Postgres 16 + pgvector + postgis
  # ---------------------------------------------------------------------------
  sokol-postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: sokol-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sokol}
      POSTGRES_USER: ${POSTGRES_USER:-sokol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "${SOKOL_POSTGRES_PORT:-5433}:5432"
    volumes:
      - sokol-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sokol} -d ${POSTGRES_DB:-sokol}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - sokol-net

  # ---------------------------------------------------------------------------
  # API - FastAPI gateway
  # ---------------------------------------------------------------------------
  sokol-api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    container_name: sokol-api
    restart: unless-stopped
    network_mode: host
    env_file:
      - ../.env
    environment:
      SOKOL_API_HOST: "0.0.0.0"
      SOKOL_API_PORT: "8000"
      DATABASE_URL: postgresql://sokol:change_me@localhost:5433/sokol
      DB_HOST: localhost
      DB_PORT: "5433"
      POSTGRES_USER: ${POSTGRES_USER:-sokol}
    depends_on:
      sokol-postgres:
        condition: service_healthy
    volumes:
      - ../synth/output:/data/ufdr-extract/synth:ro
      - ../:/data/project:ro
      - ../data/media-cache:/data/media-cache
      - ../data/staging:/data/staging
      - ../UFDRsTest:/ingest/inbox:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Embedding service — OpenAI-compatible
  # ---------------------------------------------------------------------------
  sokol-embed:
    build:
      context: ../services/embed
      dockerfile: Dockerfile
    container_name: sokol-embed
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      SOKOL_DEFAULT_EMBED_MODEL: ${SOKOL_DEFAULT_EMBED_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      SOKOL_ACTIVE_EMBED_MODEL: ${SOKOL_ACTIVE_EMBED_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      SOKOL_EMBED_DIM: ${SOKOL_EMBED_DIM:-1024}
      SOKOL_GPU_AUX: ${SOKOL_GPU_AUX:-auto}
    ports:
      - "${SOKOL_EMBED_PORT:-8001}:8001"
    volumes:
      - sokol-models:/data/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - sokol-net

  # ---------------------------------------------------------------------------
  # Vision service — YOLO object detection
  # ---------------------------------------------------------------------------
  sokol-vision:
    build:
      context: ../services/vision
      dockerfile: Dockerfile
    container_name: sokol-vision
    restart: unless-stopped
    environment:
      SOKOL_MODEL_DIR: /data/models/vision
      SOKOL_VISION_CONF: ${SOKOL_VISION_CONF:-0.25}
    ports:
      - "${SOKOL_VISION_PORT:-8007}:8007"
    volumes:
      - sokol-vision-models:/data/models/vision
      - ../data/media-cache:/data/media-cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8007/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - sokol-net

  # ---------------------------------------------------------------------------
  # OCR service — PaddleOCR text extraction
  # ---------------------------------------------------------------------------
  sokol-ocr:
    build:
      context: ../services/ocr
      dockerfile: Dockerfile
    container_name: sokol-ocr
    restart: unless-stopped
    ports:
      - "${SOKOL_OCR_PORT:-8008}:8008"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8008/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - sokol-net

  # ---------------------------------------------------------------------------
  # ASR service — faster-whisper transcription
  # ---------------------------------------------------------------------------
  sokol-asr:
    build:
      context: ../services/asr
      dockerfile: Dockerfile
    container_name: sokol-asr
    restart: unless-stopped
    ports:
      - "${SOKOL_ASR_PORT:-8009}:8009"
    volumes:
      - ../data/media-cache:/data/media-cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8009/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - sokol-net

  # ---------------------------------------------------------------------------
  # Plate detection — YOLO + OCR for license plates
  # ---------------------------------------------------------------------------
  sokol-plate:
    build:
      context: ../services/plate
      dockerfile: Dockerfile
    container_name: sokol-plate
    restart: unless-stopped
    ports:
      - "${SOKOL_PLATE_PORT:-8010}:8010"
    volumes:
      - ../data/media-cache:/data/media-cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - sokol-net

  # ---------------------------------------------------------------------------
  # Face Recognition — InsightFace detection + embeddings
  # ---------------------------------------------------------------------------
  sokol-face:
    build:
      context: ../services/face
      dockerfile: Dockerfile
    container_name: sokol-face
    restart: unless-stopped
    environment:
      SOKOL_MODEL_DIR: /data/models/face
      SOKOL_FACE_CONF: ${SOKOL_FACE_CONF:-0.5}
      SOKOL_FACE_SIM: ${SOKOL_FACE_SIM:-0.4}
    ports:
      - "${SOKOL_FACE_PORT:-8011}:8011"
    volumes:
      - sokol-face-models:/data/models/face
      - ../data/media-cache:/data/media-cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8011/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - sokol-net

  # ---------------------------------------------------------------------------
  # Worker — UFDR ingestion and background job processing
  # ---------------------------------------------------------------------------
  sokol-worker:
    build:
      context: ..
      dockerfile: api/Dockerfile
    container_name: sokol-worker
    restart: unless-stopped
    network_mode: host
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://sokol:change_me@localhost:5433/sokol
      PYTHONPATH: /data/project
    depends_on:
      sokol-postgres:
        condition: service_healthy
    volumes:
      - ../:/data/project:ro
      - ../data/media-cache:/data/media-cache
      - ../data/staging:/data/staging
      - ../UFDRsTest:/ingest/inbox:ro
    command: ["bash", "-c", "cd /data/project && python -m worker.loop"]

  # ---------------------------------------------------------------------------
  # Frontend — React SPA
  # ---------------------------------------------------------------------------
  sokol-web:
    build:
      context: ../web
      dockerfile: Dockerfile
    container_name: sokol-web
    restart: unless-stopped
    ports:
      - "${SOKOL_WEB_PORT:-3000}:80"
    depends_on:
      sokol-api:
        condition: service_healthy
    networks:
      - sokol-net

volumes:
  sokol-pgdata:
    driver: local
  sokol-models:
    driver: local
  sokol-vision-models:
    driver: local
  sokol-face-models:
    driver: local

networks:
  sokol-net:
    driver: bridge
